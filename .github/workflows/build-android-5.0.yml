name: build-android-5.0

on:
  push:
    branches: [ main ]
    paths:
      - 'android-5.0/**'
      - '.github/workflows/build-android-5.0.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-5.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        env:
          SKIP_JDK_VERSION_CHECK: '1'
        with:
          packages: 'platforms;android-33 build-tools;33.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.5.1'

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android-5.0/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generate debug keystore
        run: |
          mkdir -p $HOME/.android
          keytool -genkeypair -v \
            -storepass hibili -keypass hibili \
            -keystore $HOME/.android/debug.keystore \
            -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Sign APK (debug keystore)
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "Signing $APK"
          $ANDROID_SDK_ROOT/build-tools/33.0.0/apksigner sign \
            --ks $HOME/.android/debug.keystore \
            --ks-pass pass:hibili --key-pass pass:hibili \
            --out app/build/outputs/apk/release/HiBili-release.apk \
            "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HiBili-android5-release-apk
          path: android-5.0/app/build/outputs/apk/release/HiBili-release.apk
