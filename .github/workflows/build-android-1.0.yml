# Hi！Bili Android 1.0 参考版本构建
# 已知限制：android-4 平台已标记 obsolete，现代 SDK 源可能不再提供。
# 本 workflow 优先使用预装 SDK，尝试安装旧平台，失败则做源码校验。
name: build-android-1.0

on:
  push:
    paths:
      - 'android-1.0/**'
      - '.github/workflows/build-android-1.0.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-1.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install -y ant

      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          ls /usr/local/lib/android/sdk/

      - name: Try install obsolete android-4 platform
        continue-on-error: true
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --include_obsolete "platforms;android-4" "build-tools;19.1.0" 2>&1 || \
          echo "::warning::android-4 platform unavailable in current SDK source (expected for obsolete platform)"

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build debug APK with Ant
        continue-on-error: true
        run: ant debug 2>&1 || echo "::warning::Ant build did not produce APK (reference version, old platform components may be unavailable)"

      - name: Verify Java source syntax
        run: |
          echo "Checking Java source files exist and are non-empty..."
          find src -name "*.java" | wc -l
          find src -name "*.java" -empty | wc -l
          echo "Source verification complete."

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hibili-android-1.0-apk
          path: android-1.0/bin/*.apk
          if-no-files-found: warn
