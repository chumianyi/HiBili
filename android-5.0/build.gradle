buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP 7.0.4 is the last line that still reliably supports minSdk 21 + JDK 11
        classpath 'com.android.tools.build:gradle:7.0.4'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
